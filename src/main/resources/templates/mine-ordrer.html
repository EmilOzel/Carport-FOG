<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head>
    <meta charset="UTF-8">
    <title>Mine ordrer | FOG</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="figma-page">
    <header class="topbar">
        <a href="/"><img class="logo" src="/images/fog.png" alt="Fog"></a>
        <div class="top-icons">
            <a href="/logout">Log ud</a>
        </div>
    </header>

    <div style="padding: 32px 24px;">
        <h1>Mine ordrer</h1>
        <table class="orders-table">
            <thead>
            <tr>
                <th>Ordre ID</th>
                <th>Status</th>
                <th>Total</th>
                <th>Detaljer</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order[0]}"></td>
                <td th:text="${order[1]}"></td>
                <td th:text="${order[2]} + ' kr'"></td>
                <td><a th:href="@{/ordre/{id}(id=${order[0]})}">Se detaljer</a></td>
            </tr>
            </tbody>
        </table>
        <br>
        <a class="btn" href="/bruger-side">← Tilbage til min side</a>
    </div>
</main>
</body>
</html>
