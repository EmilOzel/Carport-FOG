<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opret sælger | FOG</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="auth-screen">
    <section class="auth-card">
        <a href="/"><img class="logo" src="/images/fog.png" alt="Fog"></a>
        <h1>Opret sælger</h1>
        <form class="auth-form" action="/admin/opret-saelger" method="post">
            <label>
                Fornavn
                <input type="text" name="fornavn" required autofocus>
            </label>
            <label>
                Email
                <input type="email" name="email" required>
            </label>
            <label>
                Adgangskode
                <input type="password" name="adgangskode" required minlength="6">
            </label>
            <p th:if="${error}" th:text="${error}" style="color:red;"></p>
            <button class="btn" type="submit">Opret</button>
            <a class="btn back-btn" href="/admin/brugere">Tilbage</a>
        </form>
    </section>
</main>
</body>
</html>
