<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sælger | FOG</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="figma-page dashboard-page">
    <header class="topbar">
        <a href="/"><img class="logo" src="/images/fog.png" alt="Fog"></a>
    </header>

    <h1 class="dashboard-title">Sælger</h1>

    <section class="admin-content">
        <p th:if="${error}" th:text="${error}" style="color:red;"></p>

        <article class="dash-card">
            <header>Ordrer</header>
            <div class="dash-body">
                <table class="orders-table">
                    <thead>
                    <tr>
                        <th>Ordre ID</th>
                        <th>Kunde</th>
                        <th>Dato</th>
                        <th>Status</th>
                        <th>Kostpris</th>
                        <th>Salgspris</th>
                        <th>Betalt</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order : ${orders}">
                        <td th:text="${order[0]}"></td>
                        <td th:text="${order[1]}"></td>
                        <td th:text="${order[3]}"></td>
                        <td>
                            <span th:switch="${order[4]}">
                                <span th:case="'pending'">Afventer</span>
                                <span th:case="'offer'">Tilbud sendt</span>
                                <span th:case="'approved'">Godkendt</span>
                                <span th:case="'rejected'">Afvist</span>
                                <span th:case="'completed'">Færdig</span>
                                <span th:case="*" th:text="${order[4]}"></span>
                            </span>
                        </td>
                        <td th:text="${order[7]} + ' kr'"></td>
                        <td th:text="${order[5]} + ' kr'"></td>
                        <td th:text="${order[6] ? 'Ja' : 'Nej'}"></td>
                        <td>
                            <a th:href="@{/saelger/ordre/{id}(id=${order[0]})}" class="btn">Se ordre</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(orders)}">
                        <td colspan="8">Ingen ordrer endnu</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </article>

        <a class="btn back-btn" href="/bruger-side">Tilbage</a>
    </section>
</main>
</body>
</html>
