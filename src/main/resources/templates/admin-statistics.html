<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Statistik | FOG</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="mob-overlay" id="mobOverlay"></div>
<nav class="mob-nav" id="mobNav" aria-label="Admin menu">
    <a href="/bruger-side">Oversigt</a>
    <a href="/mine-ordrer">Mine ordrer</a>
    <a href="/byg-carport">Byg Carport</a>
    <a href="/saelger">Sælger</a>
    <a href="/admin">Admin</a>
    <a href="/logout" class="mob-nav-logout">Log ud</a>
</nav>

<main class="figma-page dashboard-page">
    <header class="topbar">
        <a href="/"><img class="logo" src="/images/fog.png" alt="Fog"></a>
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Åbn menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
    </header>

    <h1 class="dashboard-title">Admin</h1>

    <section class="dashboard-shell">
        <nav class="side-menu" aria-label="Navigation">
            <a href="/bruger-side">Oversigt</a>
            <a href="/mine-ordrer">Mine ordrer</a>
            <a href="/byg-carport">Byg Carport</a>
            <a href="/saelger">Sælger</a>
            <a href="/admin">Admin</a>
            <a href="/logout">Log ud</a>
        </nav>

        <div style="min-width:0; overflow-x:hidden;">
            <section class="admin-content">
                <nav class="admin-tabs">
                    <a href="/admin" class="admin-tab">Ordrer</a>
                    <a href="/admin/brugere" class="admin-tab">Brugere</a>
                </nav>

                <p th:if="${error}" th:text="${error}" style="color:red; padding:0 4px;"></p>

                <article class="dash-card">
                    <header>Statistik</header>
                    <div class="stat-grid">
                        <div class="stat-card">
                            <span class="stat-label">Ordrer i alt</span>
                            <span class="stat-value" th:text="${stats['totalOrders']}">0</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-label">Denne måned</span>
                            <span class="stat-value" th:text="${stats['ordersThisMonth']}">0</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-label">Kunder</span>
                            <span class="stat-value" th:text="${stats['totalCustomers']}">0</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-label">Omsætning</span>
                            <span class="stat-value" th:text="${#numbers.formatDecimal(stats['totalRevenue'], 0, 'COMMA', 0, 'POINT')} + ' kr'">0 kr</span>
                        </div>
                        <div class="stat-card stat-card--completed">
                            <span class="stat-label">Indtjening</span>
                            <span class="stat-value" th:text="${#numbers.formatDecimal(stats['totalProfit'], 0, 'COMMA', 0, 'POINT')} + ' kr'">0 kr</span>
                        </div>
                    </div>

                    <div class="stat-divider"></div>

                    <div class="stat-grid">
                        <div class="stat-card stat-card--pending">
                            <span class="stat-label">Afventer</span>
                            <span class="stat-value" th:text="${stats['pending']}">0</span>
                        </div>
                        <div class="stat-card stat-card--approved">
                            <span class="stat-label">Godkendt</span>
                            <span class="stat-value" th:text="${stats['approved']}">0</span>
                        </div>
                        <div class="stat-card stat-card--completed">
                            <span class="stat-label">Færdig</span>
                            <span class="stat-value" th:text="${stats['completed']}">0</span>
                        </div>
                        <div class="stat-card stat-card--rejected">
                            <span class="stat-label">Afvist</span>
                            <span class="stat-value" th:text="${stats['rejected']}">0</span>
                        </div>
                    </div>
                </article>

                <a class="btn back-btn" href="/bruger-side">Tilbage</a>
            </section>
        </div>
    </section>
</main>

<script>
    const btn = document.getElementById('hamburgerBtn');
    const overlay = document.getElementById('mobOverlay');
    const nav = document.getElementById('mobNav');
    function openMenu() { btn.classList.add('open'); overlay.classList.add('open'); nav.classList.add('open'); btn.setAttribute('aria-expanded','true'); document.body.style.overflow='hidden'; }
    function closeMenu() { btn.classList.remove('open'); overlay.classList.remove('open'); nav.classList.remove('open'); btn.setAttribute('aria-expanded','false'); document.body.style.overflow=''; }
    btn.addEventListener('click', () => btn.classList.contains('open') ? closeMenu() : openMenu());
    overlay.addEventListener('click', closeMenu);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
</script>
</body>
</html>
