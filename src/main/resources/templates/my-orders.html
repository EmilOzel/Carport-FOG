<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mine ordrer | FOG</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<!-- Mobile overlay + off-canvas drawer -->
<div class="mob-overlay" id="mobOverlay"></div>
<nav class="mob-nav" id="mobNav" aria-label="Navigation">
    <a href="/bruger-side">Profil</a>
    <a href="/mine-ordrer">Mine ordrer</a>
    <a href="/choose-dimensions">Byg Carport</a>
    <a th:if="${user != null and (user.role == 'salesperson' or user.role == 'admin')}" href="/saelger">Sælger</a>
    <a th:if="${user != null and user.role == 'admin'}" href="/admin">Admin</a>
    <a href="/logout" class="mob-nav-logout">Log ud</a>
</nav>

<main class="figma-page dashboard-page">
    <header class="topbar">
        <a href="/"><img class="logo" src="/images/fog.png" alt="Fog"></a>
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Åbn menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <h1 class="dashboard-title">Mine ordrer</h1>

    <section class="dashboard-shell">
        <nav class="side-menu" aria-label="Bruger menu">
            <a href="/bruger-side">Profil</a>
            <a href="/mine-ordrer">Mine ordrer</a>
            <a href="/choose-dimensions">Byg Carport</a>
            <a th:if="${user != null and (user.role == 'salesperson' or user.role == 'admin')}" href="/saelger">Sælger</a>
            <a th:if="${user != null and user.role == 'admin'}" href="/admin">Admin</a>
            <a href="/logout">Log ud</a>
        </nav>

        <div>
            <p th:if="${error}" th:text="${error}" style="color:red; margin:0 0 12px;"></p>
            <article class="dash-card" style="overflow-x:visible; margin-bottom:16px;">
                <header>Ordrer</header>
                <div class="dash-body" style="overflow-x:visible;">
                    <table class="orders-table card-table">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Sidst opdateret</th>
                            <th>Status</th>
                            <th>Pris</th>
                            <th>Handling</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="order : ${orders}">
                            <td data-label="Ordre #" th:text="${order[0]}"></td>
                            <td data-label="Sidst opdateret" th:text="${order[3]}"></td>
                            <td data-label="Status">
                                <span th:switch="${order[1]}">
                                    <span th:case="'pending'">Afventer</span>
                                    <span th:case="'offer'">Tilbud modtaget</span>
                                    <span th:case="'approved'">Godkendt</span>
                                    <span th:case="'rejected'">Afvist</span>
                                    <span th:case="'completed'">Færdig</span>
                                    <span th:case="*" th:text="${order[1]}"></span>
                                </span>
                            </td>
                            <td data-label="Pris">
                                <span th:if="${order[1] == 'pending' or order[1] == 'rejected'}" style="color:#888;">—</span>
                                <span th:unless="${order[1] == 'pending' or order[1] == 'rejected'}" th:text="${order[2]} + ' kr'"></span>
                            </td>
                            <td data-label="Handling">
                                <div class="card-btns">
                                    <a th:href="@{/ordre/{id}(id=${order[0]})}"
                                       class="btn" style="font-size:11px; min-height:26px; padding:0 10px;">
                                        Se detaljer
                                    </a>
                                    <span th:if="${order[1] == 'offer'}" style="display:contents;">
                                        <form th:action="@{/ordre/{id}/afvis(id=${order[0]})}" method="post" style="display:inline;"
                                              onsubmit="return confirm('Er du sikker på du vil afvise tilbuddet?')">
                                            <button type="submit" class="btn btn--reject"
                                                    style="font-size:11px; min-height:26px; padding:0 10px;">Afvis</button>
                                        </form>
                                    </span>
                                    <span th:if="${order[1] == 'approved'}"
                                          style="font-size:11px; color: red; font-weight:600;">
                                        Handling kræves
                                    </span>
                                    <form th:if="${order[1] == 'pending'}"
                                          th:action="@{/ordre/{id}/annuller(id=${order[0]})}" method="post" style="display:inline;"
                                          onsubmit="return confirm('Er du sikker på du vil annullere ordre #' + [[${order[0]}]] + '?')">
                                        <button type="submit" class="btn btn--reject"
                                                style="font-size:11px; min-height:26px; padding:0 10px;">Annuller</button>
                                    </form>
                                    <form th:if="${order[1] == 'rejected'}"
                                          th:action="@{/ordre/{id}/slet(id=${order[0]})}" method="post" style="display:inline;"
                                          onsubmit="return confirm('Er du sikker på du vil slette ordre #' + [[${order[0]}]] + '?')">
                                        <button type="submit" class="btn btn--reject"
                                                style="font-size:11px; min-height:26px; padding:0 10px;">Slet</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(orders)}">
                            <td colspan="5" style="color:#777; font-style:italic; text-align:center; padding:24px;">
                                Ingen ordrer endnu
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </article>

            <a class="btn back-btn" href="#" onclick="history.back(); return false;">Tilbage</a>
        </div>
    </section>
</main>

<script src="/js/main.js"></script>
</body>
</html>
