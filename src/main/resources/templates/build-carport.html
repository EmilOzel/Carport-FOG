<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byg carport | FOG</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="figma-page">
    <header class="topbar">
        <a href="/"><img class="logo" src="/images/fog.png" alt="Fog"></a>
        <div class="top-icons">

            <!-- Ikke logget ind -->
            <a th:if="${session.currentUser == null}"
               href="/login">

                <img src="/images/person.png" alt="Log ind">
            </a>

            <!-- Logget ind -->
            <a th:if="${session.currentUser != null}"
               href="/bruger-side">

                <img src="/images/person.png" alt="Min profil">
            </a>


        </div>


    </header>

    <section class="build-content">
        <div class="build-text">
            <h1>Byg din drømmecarport hos Fog</h1>
            <p>Vælg den carporttype, der passer til dine behov, og fortsæt til næste trin, hvor du kan designe og tilpasse løsningen.</p>
        </div>
        <div class="build-options">
            <article class="build-option">
                <img src="/images/carport-fladt-tag.png" alt="Carport med fladt tag">
                <a class="btn" href="/choose-dimensions">Carport med fladt tag</a>
            </article>
            <article class="build-option">
                <img src="/images/carport-hoej-rejsning.png" alt="Carport med høj rejsning">
                <a class="btn" href="/choose-dimensions">Carport med høj rejsning</a>
            </article>
        </div>
    </section>
</main>
</body>
</html>
