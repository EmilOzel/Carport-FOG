<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantegning | FOG</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="figma-page">
    <header class="topbar">
        <a href="/"><img class="logo" src="/images/fog.png" alt="Fog"></a>
    </header>

    <section class="drawing-panel">
        <h1>Plantegning</h1>
        <div class="drawing-box" th:utext="${svg}"></div>

        <div class="drawing-actions">
            <a class="btn" href="/choose-dimensions">Ret mål</a>
            <form action="/bestil-tilbud" method="post">
                <button class="btn" type="submit">Fortsæt</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
