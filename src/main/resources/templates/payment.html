<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betal ordre | FOG</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="mob-overlay" id="mobOverlay"></div>
<nav class="mob-nav" id="mobNav" aria-label="Navigation">
    <a href="/bruger-side">Profil</a>
    <a href="/mine-ordrer">Mine ordrer</a>
    <a href="/choose-dimensions">Byg Carport</a>
    <a th:if="${user != null and (user.role == 'salesperson' or user.role == 'admin')}" href="/saelger">Sælger</a>
    <a th:if="${user != null and user.role == 'admin'}" href="/admin">Admin</a>
    <a href="/logout" class="mob-nav-logout">Log ud</a>
</nav>

<main class="figma-page dashboard-page">
    <header class="topbar">
        <a href="/"><img class="logo" src="/images/fog.png" alt="Fog"></a>
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Åbn menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
    </header>

    <h1 class="dashboard-title">Betal ordre <span th:text="'#' + ${order[0]}"></span></h1>

    <section class="admin-content">
        <article class="dash-card">
            <header>Ordreoplysninger</header>
            <div class="dash-body">
                <div class="profile-fields">
                    <span>Ordre ID</span>   <span th:text="${order[0]}"></span>
                    <span>Dato</span>       <span th:text="${order[4]}"></span>
                    <span>Status</span>     <span>Godkendt</span>
                    <span>Beløb</span>      <span th:text="${order[6]} + ' kr'" style="font-weight:700; font-size:18px; color:var(--blue);"></span>
                </div>
            </div>
        </article>

        <article class="dash-card" style="margin-top:16px;">
            <header>Bekræft betaling</header>
            <div class="dash-body" style="display:flex; flex-direction:column; gap:16px; padding:24px;">
                <p style="margin:0; font-size:14px;">
                    Du er ved at betale <strong th:text="${order[6]} + ' kr'"></strong> for ordre
                    <strong th:text="'#' + ${order[0]}"></strong>.
                </p>
                <div style="display:flex; gap:12px;">
                    <form th:action="@{/ordre/{id}/betal(id=${order[0]})}" method="post">
                        <button type="submit" class="btn btn--pay" style="min-height:40px; padding:0 28px; font-size:15px;">
                            Bekræft betaling
                        </button>
                    </form>
                    <a class="btn" href="#" onclick="history.back(); return false;" style="background:#888; min-height:40px; padding:0 28px; font-size:15px;">
                        Fortryd
                    </a>
                </div>
            </div>
        </article>
    </section>
</main>

<script src="/js/main.js"></script>
</body>
</html>
