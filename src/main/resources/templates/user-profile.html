<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min carport-side | FOG</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<!-- Mobile overlay + off-canvas drawer -->
<div class="mob-overlay" id="mobOverlay"></div>
<nav class="mob-nav" id="mobNav" aria-label="Bruger menu">
    <a href="/bruger-side">Bruger <Profil></Profil></a>
    <a href="/mine-ordrer">Mine ordrer</a>
    <a href="/byg-carport">Byg Carport</a>
    <a th:if="${user.role == 'salesperson' or user.role == 'admin'}" href="/saelger">Sælger</a>
    <a th:if="${user.role == 'admin'}" href="/admin">Admin</a>
    <a href="/logout" class="mob-nav-logout">Log ud</a>
</nav>

<main class="figma-page dashboard-page">
    <header class="topbar">
        <a href="/"><img class="logo" src="/images/fog.png" alt="Fog"></a>
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Åbn menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <h1 class="dashboard-title">Min carport-side - Velkommen <span th:text="${user.firstName}"></span></h1>

    <section class="dashboard-shell">
        <nav class="side-menu" aria-label="Bruger menu">
            <a href="/bruger-side">Profil</a>
            <a href="/mine-ordrer">Mine ordrer</a>
            <a href="/byg-carport">Byg Carport</a>
            <a th:if="${user.role == 'salesperson' or user.role == 'admin'}" href="/saelger">Sælger</a>
            <a th:if="${user.role == 'admin'}" href="/admin">Admin</a>
            <a href="/logout">Log ud</a>
        </nav>

        <p th:if="${error}" th:text="${error}" style="color:red; margin:0 0 12px;"></p>

        <div class="dashboard-grid">




            <!-- Profil -->
            <article class="dash-card">
                <header>Min brugerprofil</header>
                <div class="dash-body profile-fields">
                    <span>Navn</span>         <span th:text="${user.firstName + ' ' + user.lastName}"></span>
                    <span>Email</span>        <span th:text="${user.email}"></span>
                    <span>Adresse</span>      <span th:text="${user.address}"></span>
                    <span>Postnummer</span>   <span th:text="|${user.zipcode} ${user.city}|"></span>
                    <span>Telefonnummer</span><span th:text="${user.phone}"></span>
                    <div style="grid-column:1/-1; display:flex; justify-content:flex-end; padding:10px 8px 4px;">
                        <a href="/rediger-profil" class="btn"
                           style="font-size:12px; min-height:28px; padding:0 14px;">
                            Rediger profil
                        </a>
                    </div>
                </div>
            </article>

        </div>
    </section>
</main>

<script>
    const btn     = document.getElementById('hamburgerBtn');
    const overlay = document.getElementById('mobOverlay');
    const nav     = document.getElementById('mobNav');

    function openMenu() {
        btn.classList.add('open');
        overlay.classList.add('open');
        nav.classList.add('open');
        btn.setAttribute('aria-expanded', 'true');
        document.body.style.overflow = 'hidden';
    }

    function closeMenu() {
        btn.classList.remove('open');
        overlay.classList.remove('open');
        nav.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
    }

    btn.addEventListener('click', () => {
        btn.classList.contains('open') ? closeMenu() : openMenu();
    });
    overlay.addEventListener('click', closeMenu);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
</script>
</body>
</html>
