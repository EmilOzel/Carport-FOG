<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Brugere | FOG</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="mob-overlay" id="mobOverlay"></div>
<nav class="mob-nav" id="mobNav" aria-label="Admin menu">
    <a href="/bruger-side">Oversigt</a>
    <a href="/mine-ordrer">Mine ordrer</a>
    <a href="/byg-carport">Byg Carport</a>
    <a href="/saelger">Sælger</a>
    <a href="/admin">Admin</a>
    <a href="/logout" class="mob-nav-logout">Log ud</a>
</nav>

<main class="figma-page dashboard-page">
    <header class="topbar">
        <a href="/"><img class="logo" src="/images/fog.png" alt="Fog"></a>
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Åbn menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
    </header>

    <h1 class="dashboard-title">Admin</h1>

    <section class="dashboard-shell">
        <nav class="side-menu" aria-label="Navigation">
            <a href="/bruger-side">Oversigt</a>
            <a href="/mine-ordrer">Mine ordrer</a>
            <a href="/byg-carport">Byg Carport</a>
            <a href="/saelger">Sælger</a>
            <a href="/admin">Admin</a>
            <a href="/logout">Log ud</a>
        </nav>

        <div style="min-width:0; overflow-x:hidden;">
            <section class="admin-content">
                <nav class="admin-tabs">
                    <a href="/admin" class="admin-tab">Ordrer</a>
                    <a href="/admin/brugere" class="admin-tab active">Brugere</a>
                </nav>

                <p th:if="${error}" th:text="${error}" style="color:red; padding:0 4px;"></p>

                <article class="dash-card" style="overflow-x:visible;">
                    <header>Brugere</header>
                    <div class="dash-body" style="overflow-x:visible;">
                        <table class="orders-table card-table">
                            <thead>
                            <tr>
                                <th>ID</th><th>Navn</th><th>Email</th><th>Adresse</th>
                                <th>Postnr.</th><th>By</th><th>Rolle</th>
                                <th>Skift rolle</th><th></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="user : ${users}">
                                <td data-label="ID"      th:text="${user.id}"></td>
                                <td data-label="Navn"    th:text="${user.firstName + ' ' + user.lastName}"></td>
                                <td data-label="Email"   th:text="${user.email}"></td>
                                <td data-label="Adresse" th:text="${user.address}"></td>
                                <td data-label="Postnr." th:text="${user.zipcode}"></td>
                                <td data-label="By"      th:text="${user.city}"></td>
                                <td data-label="Rolle"   th:text="${user.role}"></td>
                                <td data-label="Skift rolle">
                                    <form th:if="${user.role != 'customer'}"
                                          th:action="@{/admin/bruger/{id}/rolle(id=${user.id})}" method="post" class="table-form">
                                        <select name="rolle">
                                            <option value="salesperson" th:selected="${user.role == 'salesperson'}">Sælger</option>
                                            <option value="admin"       th:selected="${user.role == 'admin'}">Admin</option>
                                        </select>
                                        <button type="submit" class="btn">Gem</button>
                                    </form>
                                    <span th:if="${user.role == 'customer'}" style="color:#888; font-size:12px;">—</span>
                                </td>
                                <td data-label="Slet">
                                    <div class="card-btns">
                                        <form th:action="@{/admin/bruger/{id}/slet(id=${user.id})}" method="post"
                                              onsubmit="return confirm('Er du sikker på du vil slette denne bruger?')">
                                            <button type="submit" class="btn" style="background:#c0392b; font-size:11px; min-height:26px; padding:0 10px;">Slet</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </article>

                <div style="display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;">
                    <a class="btn" href="/admin/opret-saelger">Opret sælger</a>
                    <a class="btn back-btn" href="/bruger-side">Tilbage</a>
                </div>
            </section>
        </div>
    </section>
</main>

<script>
    const btn = document.getElementById('hamburgerBtn');
    const overlay = document.getElementById('mobOverlay');
    const nav = document.getElementById('mobNav');
    function openMenu() { btn.classList.add('open'); overlay.classList.add('open'); nav.classList.add('open'); btn.setAttribute('aria-expanded','true'); document.body.style.overflow='hidden'; }
    function closeMenu() { btn.classList.remove('open'); overlay.classList.remove('open'); nav.classList.remove('open'); btn.setAttribute('aria-expanded','false'); document.body.style.overflow=''; }
    btn.addEventListener('click', () => btn.classList.contains('open') ? closeMenu() : openMenu());
    overlay.addEventListener('click', closeMenu);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
</script>
</body>
</html>
