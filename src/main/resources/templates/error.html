<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head>

    <title>Fejl | FOG</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="figma-page dashboard-page">
    <header class="topbar">
        <a href="/"><img class="logo" src="/images/fog.png" alt="Fog"></a>
    </header>

    <section class="admin-content">
        <article class="dash-card">
            <header>Der opstod en fejl</header>
            <div class="dash-body" style="padding:20px;">

            </div>
        </article>
    </section>

</html>
