<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head>
    <meta charset="UTF-8">
    <title>Ordre detaljer | FOG</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<h1>Ordre #<span th:text="${ordreId}"></span></h1>

<table>
    <thead>
    <tr>
        <th>Navn</th>
        <th>Antal</th>
        <th>Beskrivelse</th>
        <th>Enhed</th>
        <th>Pris</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="line : ${lines}">
        <td th:text="${line[0]}"></td>
        <td th:text="${line[1]}"></td>
        <td th:text="${line[2]}"></td>
        <td th:text="${line[3]}"></td>
        <td th:text="${line[4]} + ' kr'"></td>
    </tr>
    </tbody>
</table>

<a href="/mine-ordrer">← Tilbage til mine ordrer</a>
</body>
</html>
