<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            margin: 0;
        }

        .login-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);

            width: 300px;
        }

        .login-container h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 10px;

            border: 1px solid #ccc;
            border-radius: 5px;

            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;

            border: none;
            border-radius: 5px;

            background-color: #2c3e50;
            color: white;

            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #34495e;
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>Login</h1>

    <form action="login" method="post">

        <div class="form-group">
            <input type="email"
                   name="email"
                   placeholder="Email"
                   required>
        </div>

        <div class="form-group">
            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>
        </div>

        <button type="submit">
            Login
        </button>

    </form>

    <p class="error">
        ${requestScope.error}
    </p>

</div>

</body>
</html>
