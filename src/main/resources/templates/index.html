
<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOG Carport</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="home-page">

<header class="site-header">

    <a class="brand" href="/" aria-label="FOG forside">
        <img src="/images/fog.png" alt="FOG">
    </a>

    <div class="header-actions">

        <!-- Hvis bruger IKKE er logget ind -->
        <a th:if="${session.currentUser == null}"
           class="icon-link"
           href="/login"
           aria-label="Log ind">

            <img src="/images/person.png" alt="">
        </a>

        <!-- Hvis bruger ER logget ind -->
        <a th:if="${session.currentUser != null}"
           class="icon-link"
           href="/bruger-side"
           aria-label="Min profil">

            <img src="/images/person.png" alt="">
        </a>

        <!-- Kurv ikon -->
        <a class="icon-link"
           href="/kurv"
           aria-label="Kurv">

            <img src="/images/kurv.png" alt="">
        </a>

    </div>

</header>

<main>

    <section class="hero">

        <div class="hero-content">

            <p class="eyebrow">Specialbyggede carporte</p>

            <h1>Design din carport hos FOG</h1>

            <p>
                Vælg mål, tagtype og materialer, og få et hurtigt overblik over din løsning.
                Vi bygger videre på dine valg, så du kan sende en konkret forespørgsel.
            </p>

            <div class="actions">
                <a class="button primary" href="/byg-carport">
                    Start byg selv
                </a>
            </div>

        </div>

        <div class="hero-media">
            <img src="/images/home_car.png"
                 alt="Moderne dobbelt carport med to biler">
        </div>

    </section>

</main>

</body>
</html>
