<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | FOG</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="mob-overlay" id="mobOverlay"></div>
<nav class="mob-nav" id="mobNav" aria-label="Admin menu">
    <a href="/bruger-side">Profil</a>
    <a href="/mine-ordrer">Mine ordrer</a>
    <a href="/choose-dimensions">Byg Carport</a>
    <a href="/saelger">Sælger</a>
    <a href="/admin">Admin</a>
    <a href="/logout" class="mob-nav-logout">Log ud</a>
</nav>

<main class="figma-page dashboard-page">
    <header class="topbar">
        <a href="/"><img class="logo" src="/images/fog.png" alt="Fog"></a>
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Åbn menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
    </header>

    <h1 class="dashboard-title">Admin</h1>

    <section class="dashboard-shell">
        <nav class="side-menu" aria-label="Navigation">
            <a href="/bruger-side">Profil</a>
            <a href="/mine-ordrer">Mine ordrer</a>
            <a href="/choose-dimensions">Byg Carport</a>
            <a href="/saelger">Sælger</a>
            <a href="/admin">Admin</a>
            <a href="/logout">Log ud</a>
        </nav>

        <div style="min-width:0; overflow-x:hidden;">
            <section class="admin-content">
                <nav class="admin-tabs">
                    <a href="/admin" class="admin-tab active">Ordrer</a>
                    <a href="/admin/brugere" class="admin-tab">Brugere</a>
                </nav>

                <p th:if="${error}" th:text="${error}" style="color:red; padding:0 4px;"></p>

                <article class="dash-card" style="overflow-x:visible;">
                    <header>Ordrer</header>
                    <div class="dash-body" style="overflow-x:visible;">
                        <table class="orders-table card-table">
                            <thead>
                            <tr>
                                <th>#</th><th>Kunde</th><th>Email</th><th>Dato</th>
                                <th>Status</th><th>Salgspris</th><th>Kostpris</th>
                                <th>Betalt</th><th></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="order : ${orders}">
                                <td data-label="#">
                                    <a th:href="@{/ordre/{id}(id=${order[0]})}" th:text="${order[0]}"></a>
                                </td>
                                <td data-label="Kunde"     th:text="${order[1]}"></td>
                                <td data-label="Email"     th:text="${order[2]}"></td>
                                <td data-label="Dato"      th:text="${order[3]}"></td>
                                <td data-label="Status">
                                    <span th:switch="${order[4]}">
                                        <span th:case="'pending'">Afventer</span>
                                        <span th:case="'offer'">Tilbud sendt</span>
                                        <span th:case="'approved'">Godkendt</span>
                                        <span th:case="'rejected'">Afvist</span>
                                        <span th:case="'completed'">Færdig</span>
                                        <span th:case="*" th:text="${order[4]}"></span>
                                    </span>
                                </td>
                                <td data-label="Salgspris" th:text="${order[5]} + ' kr'"></td>
                                <td data-label="Kostpris"  th:text="${order[7]} + ' kr'"></td>
                                <td data-label="Betalt"    th:text="${order[6] ? 'Ja' : 'Nej'}"></td>
                                <td data-label="Slet">
                                    <div class="card-btns">
                                        <form th:action="@{/admin/ordre/{id}/slet(id=${order[0]})}" method="post"
                                              onsubmit="return confirm('Er du sikker på du vil slette ordre #' + [[${order[0]}]] + '?')">
                                            <button type="submit" class="btn btn--reject"
                                                    style="font-size:11px; min-height:26px; padding:0 10px;">Slet</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(orders)}">
                                <td colspan="9" style="color:#777; font-style:italic; text-align:center; padding:24px;">Ingen ordrer endnu</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </article>
                <a class="btn back-btn" href="#" onclick="history.back(); return false;">Tilbage</a>
            </section>
        </div>
    </section>
</main>

<script src="/js/main.js"></script>
</body>
</html>
