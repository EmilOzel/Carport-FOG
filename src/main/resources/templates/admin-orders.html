<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | FOG</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="figma-page dashboard-page">
    <header class="topbar">
        <a href="/"><img class="logo" src="/images/fog.png" alt="Fog"></a>
    </header>

    <h1 class="dashboard-title">Admin</h1>

    <section class="admin-content">
        <nav class="admin-tabs">
            <a href="/admin" class="admin-tab active">Ordrer</a>
            <a href="/admin/brugere" class="admin-tab">Brugere</a>
            <a href="/admin/statistik" class="admin-tab">Statistik</a>
        </nav>

        <p th:if="${error}" th:text="${error}" style="color:red;"></p>

        <article class="dash-card">
            <header>Ordrer</header>
            <div class="dash-body">
                <table class="orders-table">
                    <thead>
                    <tr>
                        <th>Ordre ID</th>
                        <th>Kunde</th>
                        <th>Email</th>
                        <th>Dato</th>
                        <th>Status</th>
                        <th>Pris</th>
                        <th>Betalt</th>
                        <th>Skift status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order : ${orders}">
                        <td><a th:href="@{/ordre/{id}(id=${order[0]})}" th:text="${order[0]}"></a></td>
                        <td th:text="${order[1]}"></td>
                        <td th:text="${order[2]}"></td>
                        <td th:text="${order[3]}"></td>
                        <td th:text="${order[4]}"></td>
                        <td th:text="${order[5]} + ' kr'"></td>
                        <td th:text="${order[6] ? 'Ja' : 'Nej'}"></td>
                        <td>
                            <form th:action="@{/admin/ordre/{id}/status(id=${order[0]})}" method="post" class="table-form">
                                <select name="status">
                                    <option value="pending"    th:selected="${order[4] == 'pending'}">Afventer</option>
                                    <option value="approved"   th:selected="${order[4] == 'approved'}">Godkendt</option>
                                    <option value="rejected"   th:selected="${order[4] == 'rejected'}">Afvist</option>
                                    <option value="completed"  th:selected="${order[4] == 'completed'}">Færdig</option>
                                </select>
                                <button type="submit" class="btn">Gem</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(orders)}">
                        <td colspan="8">Ingen ordrer endnu</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </article>
        <a class="btn back-btn" href="/bruger-side">Tilbage</a>
    </section>
</main>
</body>
</html>
